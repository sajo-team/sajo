server:
  port: 8083

spring:
  application:
    name: trading-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      retry:
        max-attempts: 10
        initial-interval: 2000

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/sajo?currentSchema=trading
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        default_schema: trading
    hibernate:
      ddl-auto: update
  mongodb:
    uri: mongodb://localhost:27017/ai_risk_db
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

# user-service/market-service local 프로필과 반드시 동일해야 함 (internal API 호출/검증 쌍)
sajo:
  internal:
    api-secret: local-dev-internal-api-secret-do-not-use-in-prod

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://postgres:5432/sajo?currentSchema=trading
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        default_schema: trading
    hibernate:
      ddl-auto: validate
  # MONGO_PASSWORD가 URI에 그대로 삽입됨 - URI 예약문자(@ : / ? # %) 포함 시 파싱이 깨질 수 있으니
  # .env.example의 제약(영숫자 권장)을 반드시 지킬 것
  mongodb:
    uri: mongodb://root:${MONGO_PASSWORD}@mongo-ai-risk:27017/ai_risk_db?authSource=admin
    auto-index-creation: true
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: trading-consumer-group

sajo:
  kafka:
    type-mappings:
      trading.signal.generated: com.sajo.trading_service.trading.kafka.dto.TradingSignalGeneratedEvent
  internal:
    api-secret: ${INTERNAL_API_SECRET}

kis:
  base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
