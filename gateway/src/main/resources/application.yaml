server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
---
spring:
  config:
    activate:
      on-profile: local
    import: "optional:configserver:http://localhost:8888"
---
spring:
  config:
    activate:
      on-profile: prod
    import: "optional:configserver:http://config-server:8888"
