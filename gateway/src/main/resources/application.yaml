server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    gateway:
      server.webmvc:
        routes:
          - id: user-service-users
            uri: lb://user-service
            predicates:
              - Path=/api/v1/users/**
          - id: user-service-auth
            uri: lb://user-service
            predicates:
              - Path=/api/v1/auth/**
          - id: user-service-accounts
            uri: lb://user-service
            predicates:
              - Path=/api/v1/accounts/**

          - id: market-service-market
            uri: lb://market-service
            predicates:
              - Path=/api/v1/market/**
          - id: market-service-strategies
            uri: lb://market-service
            predicates:
              - Path=/api/v1/strategies/**
          - id: market-service-admin-market
            uri: lb://market-service
            predicates:
              - Path=/api/v1/admin/market/**
          - id: market-service-admin-strategy
            uri: lb://market-service
            predicates:
              - Path=/api/v1/admin/strategy-evaluation-failures/**

          - id: trading-service-trading-limits
            uri: lb://trading-service
            predicates:
              - Path=/api/v1/trading-limits/**
          - id: trading-service-orders
            uri: lb://trading-service
            predicates:
              - Path=/api/v1/orders/**
          - id: trading-service-auto-tradings
            uri: lb://trading-service
            predicates:
              - Path=/api/v1/auto-tradings/**
          - id: trading-service-executions
            uri: lb://trading-service
            predicates:
              - Path=/api/v1/executions/**
          - id: trading-service-ai
            uri: lb://trading-service
            predicates:
              - Path=/api/v1/ai/**
          - id: trading-service-admin-ai
            uri: lb://trading-service
            predicates:
              - Path=/api/v1/admin/ai/**
    config:
      retry:
        max-attempts: 10
        initial-interval: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: local

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# 로컬 전용 값 - user-service의 local 프로필과 반드시 동일해야 함 (발급/검증 쌍이 맞아야 함)
sajo:
  jwt:
    secret: local-dev-jwt-secret-key-do-not-use-in-prod-32bytes-min
    access-token-validity-seconds: 3600
---
spring:
  config:
    activate:
      on-profile: prod

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

# TODO: 운영값은 sajo-config-repo에 user-service와 동일한 sajo.jwt.secret으로 등록할 것.
# (이 프로젝트 config-server 설정 저장소라 이 레포에서는 직접 관리하지 않음 - README 참고)
sajo:
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity-seconds: 3600
