services:
  eureka-server:
    build:
      context: ./infra/eureka-server
      dockerfile: ../../Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - sajo-net

  config-server:
    build:
      context: ./infra/config-server
      dockerfile: ../../Dockerfile
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - sajo-net

  gateway:
    build:
      context: ./infra/gateway
      dockerfile: ../../Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - sajo-net

  auth-service:
    build:
      context: ./apps/auth-service
      dockerfile: ../../Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - sajo-net

networks:
  sajo-net:
    driver: bridge