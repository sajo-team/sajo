services:
  postgres-user-account:
    image: postgres:17-alpine
    container_name: sajo-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"

  postgres-market-strategy:
    image: postgres:17-alpine
    container_name: sajo-postgres-market-strategy
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_strategy_db
    ports:
      - "5433:5432"

  postgres-trading:
    image: postgres:17-alpine
    container_name: sajo-postgres-trading
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_db
    ports:
      - "5434:5432"

  mongo-ai-risk:
    image: mongo:8.0
    container_name: sajo-mongo-ai-risk
    ports:
      - "27017:27017"
  kafka:
    image: apache/kafka:latest
    container_name: sajo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

  redis:
    image: redis:8.0-alpine
    container_name: sajo-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: sajo-prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: sajo-grafana
    ports:
      - "3000:3000"