services:
  postgres-user-account:
    image: postgres:17-alpine
    container_name: sajo-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"

  postgres-market-strategy:
    image: postgres:17-alpine
    container_name: sajo-postgres-market-strategy
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_strategy_db
    ports:
      - "5433:5432"

  postgres-trading:
    image: postgres:17-alpine
    container_name: sajo-postgres-trading
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trading_db
    ports:
      - "5434:5432"

  mongo-ai-risk:
    image: mongo:8.0
    container_name: sajo-mongo-ai-risk
    ports:
      - "27017:27017"

  kafka:
    image: apache/kafka:latest
    container_name: sajo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

  redis:
    image: redis:8.0-alpine
    container_name: sajo-redis
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: sajo-prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: sajo-grafana
    ports:
      - "3000:3000"

  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: discovery-service
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: prod

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      - discovery-service

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - discovery-service
      - config-server
    restart: on-failure

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - discovery-service
      - config-server
      - postgres-user-account
    restart: on-failure

  market-service:
    build:
      context: .
      dockerfile: market-service/Dockerfile
    container_name: market-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - discovery-service
      - config-server
      - postgres-market-strategy
    restart: on-failure

  trading-service:
    build:
      context: .
      dockerfile: trading-service/Dockerfile
    container_name: trading-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - discovery-service
      - config-server
      - postgres-trading
    restart: on-failure

  ai-risk-service:
    build:
      context: .
      dockerfile: ai-risk-service/Dockerfile
    container_name: ai-risk-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      - discovery-service
      - config-server
      - mongo-ai-risk
    restart: on-failure
