networks:
  sajo-net:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
  redis-data:
  prometheus-data:
  grafana-data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: sajo-postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sajo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/db-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - sajo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: sajo-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${DB_PASSWORD}@postgres:5432/sajo?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - sajo-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mongo-ai-risk:
    image: mongo:8.0
    container_name: sajo-mongo-ai-risk
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - sajo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mongo-exporter:
    image: percona/mongodb_exporter:0.53.0
    container_name: sajo-mongo-exporter
    command: ["--collector.diagnosticdata"]
    environment:
      MONGODB_URI: "mongodb://root:${MONGO_PASSWORD}@mongo-ai-risk:27017/?authSource=admin"
    ports:
      - "127.0.0.1:9216:9216"
    networks:
      - sajo-net
    depends_on:
      mongo-ai-risk:
        condition: service_healthy
    restart: unless-stopped

  kafka:
    platform: linux/amd64
    image: apache/kafka:3.9.0
    container_name: sajo-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - sajo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    container_name: sajo-kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "127.0.0.1:9308:9308"
    networks:
      - sajo-net
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  kafka-ui:
    platform: linux/amd64
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: sajo-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: sajo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - sajo-net
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.0-alpine
    container_name: sajo-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - sajo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis-exporter:
    image: oliver006/redis_exporter:v1.91.1
    container_name: sajo-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - sajo-net
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: sajo-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - sajo-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: sajo-alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets/slack_webhook_url:/etc/alertmanager/secrets/slack_webhook_url:ro
      - ./monitoring/secrets/operation_webhook_secret:/etc/alertmanager/secrets/operation_webhook_secret:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - sajo-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: sajo-node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - sajo-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sajo-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # grafana/provisioning/alerting/cpu-alert.yaml의 $__env{GRAFANA_SLACK_WEBHOOK_URL}이
      # 이 값을 읽는다 (Grafana Alerting - CPU 50% 이상 시 Slack 알림)
      GRAFANA_SLACK_WEBHOOK_URL: ${GRAFANA_SLACK_WEBHOOK_URL}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - sajo-net
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: discovery-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "127.0.0.1:8761:8761"
    networks:
      - sajo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ENCRYPT_KEY: ${ENCRYPT_KEY}
    ports:
      - "127.0.0.1:8888:8888"
    networks:
      - sajo-net
    depends_on:
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - sajo-net
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY}
      ACCOUNT_ENCRYPTION_SALT: ${ACCOUNT_ENCRYPTION_SALT}
      ACCOUNT_HASH_KEY: ${ACCOUNT_HASH_KEY}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - sajo-net
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  market-service:
    build:
      context: .
      dockerfile: market-service/Dockerfile
    container_name: market-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - sajo-net
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  trading-service:
    build:
      context: .
      dockerfile: trading-service/Dockerfile
    container_name: trading-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_PASSWORD: ${DB_PASSWORD}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      - sajo-net
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo-ai-risk:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  operation-service:
    build:
      context: .
      dockerfile: operation-service/Dockerfile
    container_name: operation-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./monitoring/secrets/operation_webhook_secret:/etc/operation-service/secrets/webhook_secret:ro
    ports:
      - "127.0.0.1:8084:8084"
    networks:
      - sajo-net
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped
