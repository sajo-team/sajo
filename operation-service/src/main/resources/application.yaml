server:
  port: 8084

spring:
  application:
    name: operation-service

  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      retry:
        max-attempts: 10
        initial-interval: 2000

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

sajo:
  prometheus:
    rest-client:
      connect-timeout-ms: ${PROMETHEUS_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${PROMETHEUS_READ_TIMEOUT_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,prometheus}
  metrics:
    distribution:
      slo:
        "[http.server.requests]": 1s
      percentiles-histogram:
        "[http.server.requests]": true

---
spring:
  config:
    activate:
      on-profile: local

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

sajo:
  prometheus:
    base-url: http://localhost:9090

---
spring:
  config:
    activate:
      on-profile: prod

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

sajo:
  prometheus:
    base-url: http://prometheus:9090
