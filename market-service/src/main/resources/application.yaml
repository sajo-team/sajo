server:
  port: 8082

spring:
  application:
    name: market-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      retry:
        max-attempts: 10
        initial-interval: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

market:
  quote-cache:
    ttl: 60s
    lock-ttl: 30s
    lock-wait-timeout: 5s

sajo:
  scheduler:
    enabled: ${MARKET_SCHEDULER_ENABLED:false}
    system-user-id: ${MARKET_SCHEDULER_SYSTEM_USER_ID:}
    daily-price-cron: "${MARKET_SCHEDULER_DAILY_PRICE_CRON:0 10 16 * * MON-FRI}"
    page-size: ${MARKET_SCHEDULER_PAGE_SIZE:100}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/sajo?currentSchema=market_strategy
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        default_schema: market_strategy
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
      password: redis

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://postgres:5432/sajo?currentSchema=market_strategy
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        default_schema: market_strategy
    hibernate:
      ddl-auto: validate

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
