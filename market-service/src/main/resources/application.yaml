server:
  port: 8082

spring:
  application:
    name: market-service

  # 커스텀 TaskScheduler를 따로 두지 않으면 Spring Boot 기본값(단일 스레드)을 모든 @Scheduled 빈이
  # 공유한다. MarketDailyPriceScheduler(종목별 500ms 간격 순차 호출, 장시간 실행)와
  # MarketStockIndicatorScheduler가 도는 동안 1분 정확도가 중요한 MarketRealtimePriceScheduler가
  # 밀리거나 tick을 건너뛸 수 있어(코드 리뷰 반영), 스케줄러 개수(3개)보다 여유 있게 풀 크기를 키운다.
  task:
    scheduling:
      pool:
        size: ${MARKET_SCHEDULING_POOL_SIZE:4}

  flyway:
    enabled: true
    schemas: market_strategy
    default-schema: market_strategy
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 105
    validate-migration-naming: true

  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      retry:
        max-attempts: 10
        initial-interval: 2000
    openfeign:
      client:
        config:
          kisWebSocketUserAccountFeignClient:
            # KisWebSocketClient 전용 Feign 클라이언트(KisWebSocketUserAccountFeignClient)에만 적용되는
            # 설정이다. 이 호출은 재연결 전용 단일 스레드 위에서 동기적으로 수행되므로 응답이 지연되면 그
            # 사이 예약된 다른 재연결 작업까지 밀릴 수 있어, 기존 OpenFeign 기본 타임아웃(약 10s/60s)보다
            # 짧게 명시한다. MarketQuoteQueryService 등 다른 user-service 호출부(UserAccountFeignClient,
            # contextId=user-service)는 이 설정의 영향을 받지 않고 기존 기본값을 그대로 사용한다.
            connect-timeout: ${KIS_WEBSOCKET_USER_SERVICE_CONNECT_TIMEOUT:2000}
            read-timeout: ${KIS_WEBSOCKET_USER_SERVICE_READ_TIMEOUT:3000}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: market-consumer-group

  ai:
    model:
      # Spring AI는 여러 provider 스타터가 classpath에 함께 있을 수 있어, 명시적으로 지정하지
      # 않으면 chat/embedding 모델 자동구성이 기본값(none)으로 비활성화된다. api-key가 있어도
      # 이 값이 없으면 ChatClient/EmbeddingModel 빈이 생성되지 않아 SupportChatService/
      # SupportRagConfig 기동이 실패한다.
      chat: openai
      embedding: openai
    openai:
      api-key: ${OPENAI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,prometheus}
  metrics:
    distribution:
      slo:
        "[http.server.requests]": 1s
      percentiles-histogram:
        "[http.server.requests]": true


market:
  quote-cache:
    ttl: 60s
    lock-ttl: 40s
    lock-wait-timeout: 35s
    previous-close-price-missing-ttl: 5m
  stock-master-sync:
    enabled: ${MARKET_STOCK_MASTER_SYNC_ENABLED:false}
    chunk-size: ${MARKET_STOCK_MASTER_SYNC_CHUNK_SIZE:500}
    max-download-bytes: ${MARKET_STOCK_MASTER_SYNC_MAX_DOWNLOAD_BYTES:52428800}
    connect-timeout: ${MARKET_STOCK_MASTER_SYNC_CONNECT_TIMEOUT:3s}
    read-timeout: ${MARKET_STOCK_MASTER_SYNC_READ_TIMEOUT:10s}
  websocket:
    enabled: ${MARKET_WEBSOCKET_ENABLED:false}
    url: ${MARKET_WEBSOCKET_URL:ws://ops.koreainvestment.com:31000}
    system-user-id: ${MARKET_WEBSOCKET_SYSTEM_USER_ID:}
    initial-backoff: ${MARKET_WEBSOCKET_INITIAL_BACKOFF:1s}
    max-backoff: ${MARKET_WEBSOCKET_MAX_BACKOFF:30s}
    backoff-multiplier: ${MARKET_WEBSOCKET_BACKOFF_MULTIPLIER:2.0}
    target-stock-codes: ${MARKET_WEBSOCKET_TARGET_STOCK_CODES:}
    handshake-timeout: ${MARKET_WEBSOCKET_HANDSHAKE_TIMEOUT:10s}
    text-message-buffer-size: ${MARKET_WEBSOCKET_TEXT_MESSAGE_BUFFER_SIZE:131072}
    realtime-price-snapshot-cron: "${MARKET_WEBSOCKET_REALTIME_PRICE_SNAPSHOT_CRON:0 * * * * *}"

sajo:
  support:
    rag:
      # RAG 기반 고객 응대 챗봇(#도전 과제). market.websocket.enabled 등 이 프로젝트의 다른
      # 외부 연동 플래그와 동일하게 기본값은 false다 - OPENAI_API_KEY 없이 전체 테스트/컨텍스트
      # 로딩이 항상 가능해야 하고(테스트 프로필에도 OpenAI 자격 증명을 요구하지 않는다),
      # 이 기능을 실제로 쓰려면 .env에서 SUPPORT_RAG_ENABLED=true로 명시적으로 켜야 한다.
      enabled: ${SUPPORT_RAG_ENABLED:false}
      document-path: classpath:support-docs/market-service-overview.md
      top-k: ${SUPPORT_RAG_TOP_K:3}

  scheduler:
    enabled: ${MARKET_SCHEDULER_ENABLED:false}
    system-user-id: ${MARKET_SCHEDULER_SYSTEM_USER_ID:}
    daily-price-cron: "${MARKET_SCHEDULER_DAILY_PRICE_CRON:0 10 16 * * MON-FRI}"
    page-size: ${MARKET_SCHEDULER_PAGE_SIZE:100}
    indicator-enabled: ${MARKET_INDICATOR_SCHEDULER_ENABLED:false}
    indicator-cron: "${MARKET_INDICATOR_SCHEDULER_CRON:0 20 16 * * MON-FRI}"
    kis-request-interval: ${MARKET_SCHEDULER_KIS_REQUEST_INTERVAL:500ms}
    target-stock-codes: ${MARKET_SCHEDULER_TARGET_STOCK_CODES:}

  kafka:
    type-mappings:
      trading.signal.generated: com.sajo.market_service.strategy.kafka.dto.TradingSignalGeneratedEvent
      market.price.updated: com.sajo.market_service.market.kafka.dto.MarketPriceUpdatedEvent
      market.quote.requested: com.sajo.market_service.market.kafka.dto.MarketQuoteRequestedEvent


---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/sajo?currentSchema=market_strategy
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        default_schema: market_strategy
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
      password: redis
  cloud:
    openfeign:
      client:
        config:
          user-service:
            url: ${USER_SERVICE_URL:http://localhost:8081}
          kisWebSocketUserAccountFeignClient:
            url: ${USER_SERVICE_URL:http://localhost:8081}

# user-service/trading-service local 프로필과 반드시 동일해야 함 (internal API 호출/검증 쌍)
sajo:
  internal:
    api-secret: local-dev-internal-api-secret-do-not-use-in-prod

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://postgres:5432/sajo?currentSchema=market_strategy
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        default_schema: market_strategy
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

sajo:
  internal:
    api-secret: ${INTERNAL_API_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
