# Alertmanager가 수신한 알람을 어떤 Receiver로 전달할지 정의하는 최상위 Route
route:
  receiver: default

  # alertname과 application 라벨이 같은 알람을 하나의 그룹으로 묶음
  group_by: [alertname, application]

  # 새로운 알람 그룹이 처음 발생했을 때 10초간 대기 후 전송
  # (같은 시간대에 발생한 관련 알람을 하나로 묶기 위함)
  group_wait: 10s

  # 그룹에 새 알람이 추가됐을 때 갱신 알림을 보내는 최소 간격
  group_interval: 30s

  # firing 상태가 계속 유지될 때 같은 알림을 재전송하는 주기
  repeat_interval: 1h

# 같은 대상에서 critical이 firing 중이면 같은 alertname의 warning은 억제 (중복 알림 방지)
# rules.yml에서 severity만 다르고 alertname은 같게 만든 쌍
inhibit_rules:
  - source_matchers:
      - alertname="HighCpuUsage"
      - severity="critical"
    target_matchers:
      - alertname="HighCpuUsage"
      - severity="warning"
    equal: [application, instance]

  - source_matchers:
      - alertname="RedisMemoryHigh"
      - severity="critical"
    target_matchers:
      - alertname="RedisMemoryHigh"
      - severity="warning"
    equal: [instance]

  - source_matchers:
      - alertname="HighNodeCpuUsage"
      - severity="critical"
    target_matchers:
      - alertname="HighNodeCpuUsage"
      - severity="warning"
    equal: [application, instance]

  - source_matchers:
      - alertname="NodeDiskLow"
      - severity="critical"
    target_matchers:
      - alertname="NodeDiskLow"
      - severity="warning"
    equal: [instance, mountpoint]

receivers:
  - name: default
    webhook_configs:
      - url: http://operation-service:8084/api/v1/operations/webhook
        send_resolved: true
        # operation-service의 AlertWebhookAuthenticationFilter가 이 값을 검증함 - 같은 파일을
        # operation-service 컨테이너에도 마운트해서 공유 시크릿으로 씀 (docker-compose 참고)
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/operation_webhook_secret
