# Alertmanager가 수신한 알람을 어떤 Receiver로 전달할지 정의하는 최상위 Route
route:
  receiver: default

  # alertname과 application 라벨이 같은 알람을 하나의 그룹으로 묶음
  group_by: [alertname, application]

  # 새로운 알람 그룹이 처음 발생했을 때 10초간 대기 후 전송
  # (같은 시간대에 발생한 관련 알람을 하나로 묶기 위함)
  group_wait: 10s

  # 그룹에 새 알람이 추가됐을 때 갱신 알림을 보내는 최소 간격
  group_interval: 30s

  # firing 상태가 계속 유지될 때 같은 알림을 재전송하는 주기
  repeat_interval: 1h

# 같은 대상에서 critical이 firing 중이면 같은 alertname의 warning은 억제 (중복 알림 방지)
# rules.yml에서 severity만 다르고 alertname은 같게 만든 쌍
inhibit_rules:
  - source_matchers:
      - alertname="HighCpuUsage"
      - severity="critical"
    target_matchers:
      - alertname="HighCpuUsage"
      - severity="warning"
    equal: [application, instance]

  - source_matchers:
      - alertname="RedisMemoryHigh"
      - severity="critical"
    target_matchers:
      - alertname="RedisMemoryHigh"
      - severity="warning"
    equal: [instance]

  - source_matchers:
      - alertname="HighNodeCpuUsage"
      - severity="critical"
    target_matchers:
      - alertname="HighNodeCpuUsage"
      - severity="warning"
    equal: [application, instance]

  - source_matchers:
      - alertname="NodeDiskLow"
      - severity="critical"
    target_matchers:
      - alertname="NodeDiskLow"
      - severity="warning"
    equal: [instance, mountpoint]

# Slack Incoming Webhook URL은 alertmanager.yml(git 추적됨)에 직접 못 넣음 - alertmanager 0.34.0은
# config 내 환경변수 치환을 지원하지 않아서, api_url_file로 별도 파일(git 미추적, .gitignore 처리됨)에서 읽음
receivers:
  - name: default
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        channel: "#sajo-alerts"
        send_resolved: true
        title: '{{ .GroupLabels.alertname }} ({{ .GroupLabels.application }})'
        # 알람 상태(firing/resolved)를 명시하지 않으면, resolved 알림도 firing 때와 완전히
        # 똑같은 summary/description(마지막 firing 시점 값이 그대로 얼려짐)이 와서 Slack에서
        # "새로 터진 건지 방금 해결된 건지" 구분이 안 됨
        text: |-
          {{ range .Alerts }}[{{ .Status | toUpper }}][{{ .Labels.severity | toUpper }}] {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
    webhook_configs:
      - url: http://operation-service:8084/api/v1/operations/webhook
        send_resolved: true
        # operation-service의 AlertWebhookAuthenticationFilter가 이 값을 검증함 - 같은 파일을
        # operation-service 컨테이너에도 마운트해서 공유 시크릿으로 씀 (docker-compose 참고)
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/operation_webhook_secret
