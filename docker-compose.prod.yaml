networks:
  sajo-net:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
  redis-data:
  prometheus-data:
  grafana-data:

services:
  postgres:
    image: postgres:17-alpine
    container_name: sajo-postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sajo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/db-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - sajo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  mongo-ai-risk:
    image: mongo:8.0
    container_name: sajo-mongo-ai-risk
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - sajo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.0
    container_name: sajo-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - sajo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.0-alpine
    container_name: sajo-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - sajo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  prometheus:
    image: prom/prometheus:latest
    container_name: sajo-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - sajo-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: sajo-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - sajo-net
    restart: unless-stopped

  discovery-service:
    image: ghcr.io/sajo-team/sajo-discovery-service:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: discovery-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "127.0.0.1:8761:8761"
    networks:
      - sajo-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  config-server:
    image: ghcr.io/sajo-team/sajo-config-server:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: config-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ENCRYPT_KEY: ${ENCRYPT_KEY}
    ports:
      - "127.0.0.1:8888:8888"
    networks:
      - sajo-net
    depends_on:
      discovery-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  gateway:
    image: ghcr.io/sajo-team/sajo-gateway:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: gateway
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
    ports:
      - "8080:8080"
    networks:
      - sajo-net
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    image: ghcr.io/sajo-team/sajo-user-service:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: user-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_PASSWORD: ${DB_PASSWORD}
    # ports 없음 - Gateway가 sajo-net 내부 DNS(user-service:8081)로 접근하므로
    # 호스트 포트 노출이 필요 없다. 노출해두면 EC2 호스트 자체가 침해됐을 때
    # Gateway를 거치지 않고 이 서비스를 직접 호출할 수 있는 경로가 하나 더 생긴다.
    networks:
      - sajo-net
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  market-service:
    image: ghcr.io/sajo-team/sajo-market-service:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: market-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_PASSWORD: ${DB_PASSWORD}
    # ports 없음 - user-service와 동일한 이유 (Gateway만 내부 DNS로 접근하면 됨)
    networks:
      - sajo-net
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  trading-service:
    image: ghcr.io/sajo-team/sajo-trading-service:${IMAGE_TAG:?IMAGE_TAG must be set}
    container_name: trading-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONFIG_SERVER_URL: http://config-server:8888
      DB_PASSWORD: ${DB_PASSWORD}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    # ports 없음 - user-service와 동일한 이유 (Gateway만 내부 DNS로 접근하면 됨)
    networks:
      - sajo-net
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo-ai-risk:
        condition: service_healthy
    restart: unless-stopped