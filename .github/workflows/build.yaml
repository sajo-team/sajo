name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sajo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sajo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create user_account/market_strategy/trading schemas on the shared sajo db
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d sajo -c "CREATE SCHEMA IF NOT EXISTS user_account;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d sajo -c "CREATE SCHEMA IF NOT EXISTS market_strategy;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d sajo -c "CREATE SCHEMA IF NOT EXISTS trading;"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test with Gradle
        run: ./gradlew build -x :config-server:test
