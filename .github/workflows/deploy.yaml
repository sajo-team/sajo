name: CD Deploy

on:
  workflow_run:
    workflows: ["CI Build"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: cd-deploy-main
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - gateway
          - discovery-service
          - config-server
          - user-service
          - market-service
          - trading-service

    steps:
      - name: Checkout code at the commit that CI validated
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/sajo-team/sajo-${{ matrix.service }}:latest
            ghcr.io/sajo-team/sajo-${{ matrix.service }}:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            cd ~/sajo
            git fetch origin main
            git checkout ${{ github.event.workflow_run.head_sha }}

            PREV_TAG=$(cat ~/sajo/.last_healthy_sha 2>/dev/null || echo "")

            export IMAGE_TAG=${{ github.event.workflow_run.head_sha }}
            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml up -d

            echo "Waiting for gateway health check..."
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                HEALTHY=true
                break
              fi
              echo "Not healthy yet, retrying ($i/30)..."
              sleep 5
            done

            if [ "$HEALTHY" = true ]; then
              echo "$IMAGE_TAG" > ~/sajo/.last_healthy_sha
              echo "Deploy succeeded, gateway is healthy."
              exit 0
            fi

            echo "Gateway did not become healthy within timeout."
            if [ -n "$PREV_TAG" ]; then
              echo "Rolling back to previous known-good image: $PREV_TAG"
              export IMAGE_TAG=$PREV_TAG
              docker compose -f docker-compose.prod.yaml pull
              docker compose -f docker-compose.prod.yaml up -d
              echo "Rollback attempted. Marking this deploy as failed for visibility."
            else
              echo "No previous known-good image recorded — cannot roll back automatically."
            fi
            exit 1