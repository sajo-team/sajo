server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      retry:
        max-attempts: 10
        initial-interval: 2000
    openfeign:
      circuitbreaker:
        enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10 #최근 10번 호출 저장
        minimum-number-of-calls: 5 # 서킷 브레이커 동작하기 위한 최소 호출 수
        failure-rate-threshold: 50 # 실패율 50% 이상이면 open 상태
        wait-duration-in-open-state: 10s # open 상태에서 half-open으로 전환하는 대기시간
        permitted-number-of-calls-in-half-open-state: 3 # 서킷브레이커가 half-open 상태에서 허용하는 최대 호출 수

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/sajo?currentSchema=user_account
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        default_schema: user_account
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
      password: redis

# 로컬 전용 값 - 실제 계정 데이터가 없는 로컬 DB에서만 쓰임, 운영 키와 무관
sajo:
  crypto:
    account-key: local-dev-account-encryption-key
    account-salt: e9f26d0f9854767f
    account-hash-key: reM647WLMdaO/aIbzmDTKhOnJN0dcy00pcU2OKa4bq4=
  # gateway의 local 프로필과 반드시 동일해야 함 (발급/검증 쌍이 맞아야 함)
  jwt:
    secret: local-dev-jwt-secret-key-do-not-use-in-prod-32bytes-min
    access-token-validity-seconds: 3600
  # market-service/trading-service local 프로필과 반드시 동일해야 함 (internal API 호출/검증 쌍)
  internal:
    api-secret: local-dev-internal-api-secret-do-not-use-in-prod

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://postgres:5432/sajo?currentSchema=user_account
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        default_schema: user_account
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

sajo:
  crypto:
    account-key: ${ACCOUNT_ENCRYPTION_KEY}
    account-salt: ${ACCOUNT_ENCRYPTION_SALT}
    account-hash-key: ${ACCOUNT_HASH_KEY}
  # TODO: 운영값은 sajo-config-repo에 gateway와 동일한 sajo.jwt.secret으로 등록할 것
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity-seconds: 3600
  internal:
    api-secret: ${INTERNAL_API_SECRET}


eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
