server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      retry:
        max-attempts: 10
        initial-interval: 2000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/sajo?currentSchema=user_account
    username: postgres
    password: postgres
  jpa:
    properties:
      hibernate:
        default_schema: user_account
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
      password: redis

# 로컬 전용 값 - 실제 계정 데이터가 없는 로컬 DB에서만 쓰임, 운영 키와 무관
sajo:
  crypto:
    account-key: local-dev-account-encryption-key
    account-salt: e9f26d0f9854767f
    account-hash-key: reM647WLMdaO/aIbzmDTKhOnJN0dcy00pcU2OKa4bq4=
  redis:
    cache:
      ttl:
        kis-access-token: 23h

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://postgres:5432/sajo?currentSchema=user_account
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        default_schema: user_account
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

sajo:
  crypto:
    account-key: ${ACCOUNT_ENCRYPTION_KEY}
    account-salt: ${ACCOUNT_ENCRYPTION_SALT}
    account-hash-key: ${ACCOUNT_HASH_KEY}
  redis:
    cache:
      ttl:
        kis-access-token: 23h


eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
